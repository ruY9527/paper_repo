[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperflow"
version = "1.0.0"
description = "PaperFlow 2026 - 顶会顶刊论文自动化采集、分析与博客发布系统"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "tenacity>=8.3",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "PyMuPDF>=1.24",
    "Pillow>=10.0",
    "python-frontmatter>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "respx>=0.21",
]
docs = [
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
]

[project.scripts]
paperflow = "paperflow.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
